# Drupal Manager — Globale configuratie
# Pas deze waarden aan aan jouw omgeving

# ── Directories ───────────────────────────────────────────────────────────────
SITES_DIR="/var/www/drupal"
TRAEFIK_DYNAMIC_DIR="/etc/traefik/dynamic"
NGINX_CONF_DIR="/etc/nginx/conf.d"
STATE_DIR="/var/lib/drupal-manager"

# ── Port range voor lokale Nginx backends ─────────────────────────────────────
PORT_START=8100
PORT_END=8999

# ── Domein ────────────────────────────────────────────────────────────────────
# Basisdomein — hostnaam.BASE_DOMAIN wordt het volledige domein per site
BASE_DOMAIN="v-tuijl.nl"

# ── Traefik ───────────────────────────────────────────────────────────────────
CERT_RESOLVER="letsencrypt"
TRAEFIK_ENTRYPOINT_HTTP="web"
TRAEFIK_ENTRYPOINT_HTTPS="websecure"
CATCHALL_PORT=8099          # Nginx poort voor de "site niet gevonden" pagina

# Traefik dynamic config — één bestand, beheerd via Python (yaml)
TRAEFIK_DYNAMIC_FILE="/home/asuerus/docker/traefik/traefik-dynamic.yaml"

# Gateway-IP van het traefik-net Docker-netwerk.
# Traefik draait in Docker en bereikt native Nginx-backends via dit IP.
# Ophalen met: docker network inspect traefik-net --format '{{range .IPAM.Config}}{{.Gateway}}{{end}}'
TRAEFIK_BACKEND_HOST="172.31.0.1"

# ── Database ──────────────────────────────────────────────────────────────────
DB_HOST="localhost"
DB_ROOT_PASSWORD_FILE="/root/.drupal-manager-dbroot"

# ── Composer ──────────────────────────────────────────────────────────────────
COMPOSER_BIN="/usr/local/bin/composer"

# ── Authentik (optioneel) ─────────────────────────────────────────────────────
# Zet AUTHENTIK_ENABLED=true en vul de URLs in als je Authentik wilt gebruiken
AUTHENTIK_ENABLED=true
AUTHENTIK_URL="https://authentik.v-tuijl.nl"
AUTHENTIK_OUTPOST_URL="http://authentik-proxy:9000"
AUTHENTIK_MIDDLEWARE_NAME="authentik"
# API token: Authentik → Admin → Directory → Tokens → Token aanmaken (intent: API)
AUTHENTIK_TOKEN=""
